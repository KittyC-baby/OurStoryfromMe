<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Letter ❤️</title>

    <link rel="stylesheet" href="page2.css">

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="stars"></div>

        <div class="petals"></div>

    </div>

    <!-- Envelope -->

    <div class="envelope-container" id="envelopeContainer">

        <div class="message">
            A piece of my heart...<br>
            just for you. ❤️
        </div>

        <div class="envelope" onclick="openLetter()">

            <div class="top"></div>

            <div class="body"></div>

            <div class="seal">❤️</div>

        </div>

        <p class="click">
            Tap the envelope 💌
        </p>

    </div>

    <!-- Letter -->

    <div class="letter-container" id="letterContainer">

        <div class="paper">

            <h2>💌 My Letter 💌</h2>

            <div id="letterText"></div>

        </div>

        <button onclick="nextPage()" class="nextBtn">
            Continue ➜
        </button>

    </div>

    <script src="page2.js"></script>

</body>

</html>
